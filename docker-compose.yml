services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reviseai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reviseai
    volumes:
      - reviseai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reviseai"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  reviseai_pgdata:
